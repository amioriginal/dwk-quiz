<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>세 개의 문 · 그림자 배경화면 · @dontwannaknow.kr</title>
<meta name="theme-color" content="#05060d">
<style>
@font-face{font-family:Pre;src:url(../../fonts/Pretendard-Black.otf);font-display:swap}
@font-face{font-family:Gal;src:url(../../fonts/Galmuri11-Bold.woff2);font-display:swap}
:root{--y:#FFD447;--ink:#05060d;--line:rgba(255,255,255,.12);--sub:rgba(255,255,255,.78)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:#fff;min-height:100%}
body{font-family:Pre,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.45}
.wrap{max-width:460px;margin:0 auto;padding:24px 16px 40px;text-align:center}
.badge{font-family:Gal,Pre,sans-serif;font-size:14px;color:var(--y)}
h1{font-size:30px;line-height:1.15;margin-top:8px;letter-spacing:-.02em;word-break:keep-all}
.pv{display:block;width:78%;max-width:320px;height:auto;margin:20px auto 0;border-radius:26px;border:1px solid var(--line);box-shadow:0 0 40px rgba(130,110,255,.25)}
.btn{display:block;width:100%;background:var(--y);color:#1a1300;border-radius:16px;padding:17px 14px;font-family:Pre,sans-serif;font-size:20px;text-decoration:none;margin-top:22px;box-shadow:0 5px 0 #b8901a}
.how{margin-top:16px;color:var(--sub);font-size:16px;word-break:keep-all}
.how b{color:var(--y);font-weight:400}
.tip{margin-top:12px;color:rgba(255,255,255,.62);font-size:14px;word-break:keep-all}
.me{display:inline-block;margin-top:30px;color:var(--y);font-family:Gal,Pre,sans-serif;font-size:16px;text-decoration:none;border-bottom:1px solid var(--y)}
</style>
</head>
<body><div class="wrap">
<p class="badge">세 개의 문 · 1/3</p>
<h1>그림자 배경화면</h1>
<img class="pv" src="preview.jpg" width="720" height="1280" alt="세 개의 문 그림자 배경화면 미리보기">
<a class="btn" href="wallpaper.png">원본 받기</a>
<p class="how">열린 그림을 <b>길게 눌러 저장</b>하면 사진 앱에 담겨.</p>
<p class="tip">인스타 앱 안에서 저장이 안 되면 오른쪽 위 ⋯ → 외부 브라우저로 열기.</p>
<a class="me" href="https://www.instagram.com/dontwannaknow.kr/">@dontwannaknow.kr</a>
</div>
<script src="../../nowidow.js"></script>
</body>
</html>
