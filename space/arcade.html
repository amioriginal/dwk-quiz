<style>
  /* 게임 목록 — SpaceX 「다가오는 발사」처럼 가는 선으로 나눈 글자 목록. 장면은 위(폰) · 왼쪽(컴퓨터) 한 장 */
  .a-hero { min-height: 52svh; }
  .a-hero .gx-bg { object-position: 50% 70%; }
  .ticket { justify-self: start; display: inline-flex; align-items: center; gap: 8px; font: 600 11px/1 var(--sans); letter-spacing: .06em; color: var(--fg2); padding: 6px 8px; border: 1px solid var(--line); border-radius: 2px; }
  .ticket .ic { width: 14px; height: 14px; }
  .a-list { padding: 4px 20px 48px; }
  .a-today { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .a-today .mini { flex: none; width: 44px; height: 44px; border-radius: 50%; background-size: 118%; background-position: center 45%; box-shadow: 0 0 0 1px rgba(240, 240, 250, .2); }
  .a-today span { min-width: 0; } .a-today small { display: block; font: 600 11px/1 var(--sans); letter-spacing: .06em; color: var(--fg3); }
  .a-today b { display: block; margin-top: 6px; font: 700 16px/1.3 var(--sans); } .a-today em { display: block; margin-top: 3px; font: 400 13px/1.3 var(--sans); font-style: normal; color: var(--fg2); }
  .a-today::after { content: '→'; margin-left: auto; color: var(--fg3); }
  .a-today:active { background: rgba(240, 240, 250, .06); }
  .games { list-style: none; margin: 0; padding: 0; }
  .games a { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; min-height: 84px; padding: 16px 0; border-bottom: 1px solid var(--line); transition: background .2s; }
  .games a:active { background: rgba(240, 240, 250, .06); }
  .games .n { align-self: start; padding-top: 5px; font: 600 11px/1 var(--sans); letter-spacing: .08em; color: var(--fg3); }
  .games b { display: block; font: 700 20px/1.25 var(--sans); letter-spacing: -.02em; }
  .games .d { display: block; margin-top: 4px; font: 400 13px/1.4 var(--sans); color: var(--fg2); word-break: keep-all; }
  .games .r { display: flex; align-items: center; gap: 12px; font: 500 12px/1.3 var(--sans); color: var(--fg2); text-align: right; white-space: nowrap; }
  .games .r::after { content: '→'; font-size: 15px; color: var(--fg3); transition: transform .2s, color .2s; }
  .games a:hover .r::after { color: var(--fg); transform: translateX(3px); }
  .games .r:empty::after { margin-left: 0; }
  .codebox { display: flex; gap: 8px; } .codebox input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .1em; }
  .codebox .gx-btn { flex: none; }
  .codehint { margin: 8px 0 0; }
  .rewards { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .rewards:empty { display: none; }
  .rewards span { font: 500 12px/1 var(--sans); color: var(--fg); padding: 7px 9px; border: 1px solid var(--line); border-radius: 2px; }
  .a-foot { display: flex; flex-wrap: wrap; gap: 4px 22px; padding-top: 22px; }
  @media (min-width: 900px) {
    .a-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    .a-hero { position: sticky; top: 0; min-height: 100vh; }
    .a-list { padding: 96px 48px 64px; max-width: 680px; }
    .games b { font-size: 24px; }
  }

<body class="gx">
<canvas id="stars" aria-hidden="true"></canvas>
<header class="gx-nav">
  <a class="gx-mark" href="start.html">돈워너노우</a>

  <nav class="gx-navr"><a href="start.html">입구</a><button class="gx-icon" id="snd" type="button"></button></nav>
</header>
<div class="a-wrap">
  <section class="gx-hero a-hero">
    <img class="gx-bg" src="img/door/land.jpg" alt="" decoding="async">
    <div class="gx-cap">
      <div id="seat" hidden></div>
      <p class="gx-eyebrow"><span>03</span>게임 4개</p>
      <h1 class="gx-h1">1분 게임</h1>
      <p class="gx-sub">영상 속 행성이 그대로 게임이 됐어. <b>누르면 바로 시작해.</b></p>
    </div>
  </section>
  <main class="a-list" id="app">
    <a class="a-today" id="today" href="survive.html?daily=1"></a>
    <ul class="games" id="games" aria-label="게임 — 누르면 바로 시작"></ul>

    <p class="gx-label">그 밖에</p>
    <ul class="gx-rows" id="more"></ul>

    <p class="gx-label">내 기록 · 이 기기에만 저장</p>
    <dl class="gx-rows" id="stats"></dl>

    <p class="gx-label">영상 속 코드</p>
    <div class="codebox"><input id="code" maxlength="12" placeholder="코드" autocomplete="off" aria-label="코드 입력"><button class="gx-btn" id="redeem" type="button">코드 열기</button></div>
    <p class="gx-note codehint">영상 마지막 1초에 코드가 숨어 있어</p>
    <div class="rewards" id="rewards"></div>
    <div id="follow"></div>
    <nav class="a-foot"><a class="gx-txt" href="start.html">입구로</a><a class="gx-txt" href="index.html">영상 속 행성 고르기</a><a class="gx-txt" href="#" data-dwk-account hidden>내 기록 지키기</a></nav>
  </main>
</div>

<script src="icons.js?v=1"></script>

<script src="dwk-prog.js?v=14"></script>
<script>
(() => {
  const { el } = DC; const $ = (s) => document.querySelector(s);
  const seat = (new URLSearchParams(location.search).get('seat') || '').replace(/\D/g, '').slice(0, 3);
  const q = seat ? `?seat=${seat}` : '';
  if (seat) { $('#seat').hidden = false; $('#seat').append(el('span', { class: 'ticket' }, DI.ic('ticket'), `비공개 테스트 · 좌석 ${seat}번`)); }
  // 내 최고 기록(이 기기 localStorage · 입구 start.html과 같은 키)
  const n = (v) => Number(v || 0).toLocaleString('ko-KR');
  const bm = DC.store.get('best_merge', 0), bs = DC.store.get('best_survive', null), bl = DC.store.get('land_best', 0), bf = DC.store.get('find_best', 0);
  const GAMES = [
    { href: 'merge.html', name: '행성 합치기', desc: '같은 행성끼리 합쳐서 가장 큰 행성까지', best: bm ? `내 최고 ${n(bm)}점` : '' },
    { href: 'survive.html', name: '행성 생존', desc: '카드를 좌우로 넘겨 1년 버티기 · 엔딩 수집', best: bs && bs.days ? `내 최고 ${bs.days}일` : '' },
    { href: 'land.html', name: '행성 착륙', desc: '탭 한 번, 도는 행성의 초록에 착륙', best: bl ? `내 최고 ${n(bl)}점` : '' },
    { href: 'find.html', name: '빈틈 찾기', desc: '장면 속 위험을 8초 안에', best: bf ? `내 최고 ${n(bf)}점` : '' },
  ];
  $('#games').append(...GAMES.map((g, i) => el('li', {}, el('a', { href: g.href + q },
    el('span', { class: 'n' }, String(i + 1).padStart(2, '0')),
    el('span', {}, el('b', {}, g.name), el('span', { class: 'd' }, g.desc)),
    el('span', { class: 'r' }, g.best)))));
  // 오늘의 행성 — survive.js 의 dailyPlanet()과 같은 후보·같은 시드(행성 생존 카드가 있는 행성, 숨은 행성 제외)라 같은 행성이 나온다
  const SURV = new Set(['1-1', '1-2', '1-3', '1-4', '2-1', '2-2', '5-1', '5-2', '3-3', '5-4']);
  const pool = DC.planets().filter(p => SURV.has(p.id));
  const r = DC.rng(DC.seed('survive' + DC.today())); const today = pool[Math.floor(r() * pool.length)];
  const done = DC.store.get('daily_' + DC.today(), null);
  if (today) {
    $('#today').href = 'survive.html?daily=1' + (seat ? `&seat=${seat}` : '');
    $('#today').append(el('i', { class: 'mini', style: `background-image:url(${today.img})`, 'aria-hidden': 'true' }),
      el('span', {}, el('small', {}, `오늘의 행성 · ${DC.today().slice(5).replace('-', '/')}`), el('b', {}, `${today.name}에서 1년 버티기`),
        el('em', {}, done ? `오늘 기록 ${done.days}일 · 모두 같은 문제` : '오늘은 모두 같은 문제를 풀어')));
  } else $('#today').remove();
  // 그 밖에 — 광장(world·town·maker)은 탑승 대기 중이라 대기실로만 보낸다
  $('#more').append(
    el('li', {}, el('a', { href: 'plaza.html' + q }, '자랑 게시판', el('small', {}, '내 캐릭터 자랑하기'))),
    el('li', {}, el('a', { href: 'start.html#wait' }, '탑승 대기실', el('small', {}, '내 캐릭터로 광장 놀기 · 열리기 전'))));
  $('#stats').append(
    el('div', {}, el('dt', {}, '행성 생존 · 최장'), el('dd', {}, bs && bs.days ? `${bs.days}일` : '–')),
    el('div', {}, el('dt', {}, '모은 엔딩·업적'), el('dd', {}, String(DC.endings.total()))),
    el('div', {}, el('dt', {}, '해금 아이템'), el('dd', {}, String(DC.rewards.list().length))));
  const showRewards = () => { $('#rewards').replaceChildren(...DC.rewards.list().map(x => el('span', {}, DI.strip(x.label)))); };
  showRewards();
  $('#redeem').onclick = () => { const res = DC.redeem($('#code').value); DC.toast(res.msg); if (res.ok) { $('#code').value = ''; showRewards(); } };
  $('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#redeem').click(); });
  $('#follow').append(DC.followCta());
  DI.sound($('#snd'));
})();
</script>
</body>
