<body class="world">
<canvas id="scene" aria-label="3D 우주 광장"></canvas>
<div id="tags" aria-hidden="true"></div>

<!-- 위 -->
<header class="w-top">
  <a class="w-icon k" href="start.html" aria-label="시작화면으로" data-ic="back"></a>
  <div class="w-title"><b>우주 광장</b><span id="online" class="w-online" title="지금 광장에 있는 주민 수(실제 접속만)">나 혼자</span></div>
  <button class="w-icon k" id="menuBtn" type="button" aria-label="메뉴" data-ic="menu"></button>
</header>
<button class="w-stat" id="stat" type="button" aria-label="레벨과 코인 · 오늘의 미션">
  <b id="lv">Lv.1</b><span class="xp"><i id="xpBar"></i></span><span class="coin"><i class="cn" aria-hidden="true"></i><b id="coins">0</b></span>
</button>
<div class="w-side">
  <button class="k" id="questBtn" type="button" data-ic="check"><span>미션</span></button>
  <button class="k" id="bookBtn" type="button" data-ic="board"><span id="bookCount">0/0</span></button>
</div>
<p class="w-guest hidden" id="guestBar">구경 중 · <a href="maker.html?flow=join">내 캐릭터 만들기 ▸</a></p>

<!-- 채팅 기록(최근 몇 줄) -->
<ol class="w-log" id="log" aria-live="polite" aria-label="채팅"></ol>

<!-- 튜토리얼 -->
<div class="w-coach hidden" id="coach" role="status">
  <div class="bot" id="coachBot" aria-hidden="true"></div>
  <div>
    <div class="who"><span>안내봇 삐삐</span><span class="w-coach-dots" id="coachDots"></span></div>
    <p id="coachText"></p>
    <button type="button" id="coachSkip">안내 건너뛰기</button>
  </div>
</div>

<!-- 가까운 시설 들어가기 -->
<button class="w-act k hidden" id="act" type="button"><span id="actIcon"></span><b id="actText">들어가기</b><kbd id="actKey" hidden>E</kbd></button>

<!-- 아래: 조이스틱 · 채팅 · 손 흔들기 -->
<div class="w-joy" id="joy" aria-label="이동 조이스틱"><i id="knob"></i></div>
<p class="w-keys" aria-hidden="true"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 걷기 · 땅 클릭 = 그곳으로<br><kbd>Enter</kbd> 채팅 · <kbd>E</kbd> 들어가기 · 끌기 = 시점 · 휠 = 확대</p>
<div class="w-chat">
  <div class="w-quick" id="quick" role="toolbar" aria-label="빠른 말"></div>
  <form class="w-say" id="sayForm" autocomplete="off">
    <input id="say" maxlength="60" placeholder="말하기…" aria-label="채팅 입력" enterkeyhint="send">
    <button class="k" type="submit" aria-label="보내기" data-ic="send"></button>
  </form>
</div>
<button class="w-emote k" id="emote" type="button" aria-label="손 흔들기" data-ic="wave"></button>

<!-- 시트(전당·극장·내 정보·가입 등 공용) -->
<section class="w-sheet hidden" id="sheet" role="dialog" aria-modal="true">
  <div class="w-box">
    <div class="w-head"><b id="sheetTitle"></b><button class="k" type="button" id="sheetClose" aria-label="닫기" data-ic="x"></button></div>
    <div id="sheetBody"></div>
  </div>
</section>

<div class="w-load ship" id="loading"><div class="w-door l"></div><div class="w-door r"></div><div class="w-cabin"><div class="w-port"><b style="--a:0deg;--d:0.00s"></b><b style="--a:24deg;--d:0.37s"></b><b style="--a:48deg;--d:0.74s"></b><b style="--a:72deg;--d:0.01s"></b><b style="--a:96deg;--d:0.38s"></b><b style="--a:120deg;--d:0.75s"></b><b style="--a:144deg;--d:0.02s"></b><b style="--a:168deg;--d:0.39s"></b><b style="--a:192deg;--d:0.76s"></b><b style="--a:216deg;--d:0.03s"></b><b style="--a:240deg;--d:0.40s"></b><b style="--a:264deg;--d:0.77s"></b><b style="--a:288deg;--d:0.04s"></b><b style="--a:312deg;--d:0.41s"></b><b style="--a:336deg;--d:0.78s"></b></div><p id="loadMain">탑승 대기장으로 가는 중</p><small id="loadSub">도착하면 문이 열려. 뛰어내려서 탑승구로 가.</small></div></div>
<script>if(/[?&](from|nodrop)=/.test(location.search)){loadMain.textContent='탑승 대기장으로 돌아가는 중';loadSub.textContent='곧 도착해.';}</script>
