<style>
  /* maker.html 옷 — 광장(world.css)과 같은 「레트로 게임기」 문법(2026-11-20 UX 점검 4번):

  @font-face { font-family: 'Galmuri11'; src: url('fonts/Galmuri11-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }

  body.mk {

  .mk-planet.on span { background: var(--sun); }

  .mk-note { margin: 12px 0 0; font: 400 12px/1.5 var(--dot); color: var(--mute); word-break: keep-all; }
  .mk-note a { color: var(--ink); text-decoration: underline; display: inline-flex; align-items: center; min-height: 44px; gap: 4px; }

  .mk-opt { text-align: center; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; min-width: 0; }
  .mk-dock::before { content: ''; position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(to bottom, rgba(36,30,56,0), var(--night)); pointer-events: none; }

  /* 알림(dwk-core 토스트)도 같은 옷 */
  body.mk .dc-toast { background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 10px; box-shadow: 0 4px 0 var(--ink); font: 400 13px/1.4 var(--dot); white-space: normal; max-width: 90vw; text-align: center; top: calc(64px + env(safe-area-inset-top)); bottom: auto; }

  /* 가로 화면: 왼쪽 미리보기 | 오른쪽 꾸미기 (점검 D8) */

    .mk-who b { font-size: 20px; }

    .mk-dock { left: calc(40% + 12px); right: 0; max-width: none; margin: 0; padding-right: max(16px, env(safe-area-inset-right)); }
  }
  @media (prefers-reduced-motion: reduce) { .k, .mk-tab, .mk-opt { transition: none; } }
</style>

paintSnd(DC.sfx.on());
$('#snd').onclick = () => { paintSnd(DC.sfx.toggle()); DC.sfx('tap'); };

// 시작화면에서 온 흐름(?flow=join): 완성 → 광장 주민 등록 · 광장에서 온 꾸미기(?flow=world): 완성 → 광장
const FLOW = new URLSearchParams(location.search).get('flow');
if (FLOW === 'join') { $('#back').href = 'start.html'; $('#back').lastChild.textContent = '처음으로'; }

let S = K.myChar() || K.defaultChar();
const PLANETS = K.homePlanets();
if (!PLANETS.some(p => p.id === S.p)) S.p = PLANETS[0]?.id || '1-1';
// 해금 안 된 것은 처음 값으로 (기기 저장이 일부 지워졌을 때)
if (!K.hatOpen(K.HATS[S.hat])) S.hat = 0;
if (!K.titleOpen(S.title)) S.title = 0;

// ── 3D 미리보기 ──
const canvas = $('#view');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch { $('#load').textContent = '이 브라우저는 3D를 못 열어. 크롬·사파리 최신판으로 열어 줘.'; throw new Error('WebGL 없음'); }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.NeutralToneMapping; renderer.setClearColor(0, 0);
const { scene, camera } = K.makeStage();
const turn = new THREE.Group(); scene.add(turn);
let ch = null, yaw = -0.35, vel = 0, drag = null, buildN = 0;
function fit() { const r = canvas.getBoundingClientRect(); if (!r.width || !r.height) return; renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', fit); fit();
if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);
async function rebuild(bounce = true) {
  const my = ++buildN; const next = await K.makeCharacter(S); if (my !== buildN || !next) return;
  if (ch) turn.remove(ch.root); ch = next; turn.add(ch.root); ch.pose(S.pose, false);
  $('#load').style.display = 'none';
  if (bounce) { ch.root.scale.setScalar(0.9); bounceT = 0; }
}
let bounceT = 1;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y0: yaw }; vel = 0; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
canvas.addEventListener('pointermove', (e) => { if (!drag) return; const ny = drag.y0 + (e.clientX - drag.x) * 0.012; vel = ny - yaw; yaw = ny; });
const end = () => { drag = null; canvas.style.cursor = 'grab'; };
canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!drag) { yaw += vel; vel *= 0.92; }
  turn.rotation.y = yaw;
  if (ch) { ch.mixer.update(dt); if (bounceT < 1) { bounceT = Math.min(1, bounceT + dt * 4); ch.root.scale.setScalar(0.9 + 0.1 * Math.sin(bounceT * Math.PI * 0.5) + 0.06 * Math.sin(bounceT * Math.PI)); } }
  renderer.render(scene, camera);
});

// ── 위 글자 ──
function header() {
  $('#name').textContent = K.charName(S);
  $('#title').replaceChildren(ic('title'), K.TITLES[S.title].name);
  $('#sub').textContent = `출신 ${DC.planet(S.p)?.name || ''} · 특기 ${K.SKILLS[S.skill]}`;
  $('#stageBg').style.backgroundImage = `url(${DC.scene(S.p, 'a')})`;
  $('#toPlaza').href = `plaza.html#c=${K.encodeChar(S)}`;
}
function set(k, v, rebuildIt = true) { S[k] = v; K.saveChar(S); header(); DC.sfx('tap'); DC.buzz(8); if (rebuildIt) rebuild(); draw(); }

// ── 탭 ──
const TABS = [
  { id: 'body', name: '몸', ico: 'user' }, { id: 'color', name: '색', ico: 'color' }, { id: 'hat', name: '모자', ico: 'hat' },
  { id: 'pose', name: '자세', ico: 'pose' }, { id: 'planet', name: '출신', ico: 'planet' }, { id: 'name', name: '이름', ico: 'name' },
  { id: 'title', name: '칭호', ico: 'title' }, { id: 'skill', name: '특기', ico: 'skill' },
];
let tab = 'body';
for (const t of TABS) $('#tabs').append(el('button', { class: 'mk-tab', role: 'tab', type: 'button', 'aria-selected': String(t.id === tab), 'data-id': t.id, onclick: () => { tab = t.id; document.querySelectorAll('.mk-tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === tab))); DC.sfx('tap'); draw(); } }, ic(t.ico), t.name));

// 잠긴 것: 칸에는 한 줄만, 자세한 조건은 눌렀을 때
const lockLine = (how = '') => /코드/.test(how) ? '코드로 열려' : '게임에서 열려';
const lockTap = (name, how) => { DC.sfx('bad'); DC.toast(`「${name}」 여는 법: ${how}`); };

const thumbs = {};
async function thumb(key, char, opts) {
  if (key in thumbs) return thumbs[key];
  const c = await K.portrait(char, 128, 128, opts);
  return (thumbs[key] = c ? c.toDataURL('image/png') : '');
}
let SW = null;
const panel = $('#panel');
function opt(on, kids, onclick, extra = '') { return el('button', { class: `mk-opt${on ? ' on' : ''}${extra}`, type: 'button', onclick }, ...kids); }
async function draw() {
  const myTab = tab;
  panel.replaceChildren();
  if (tab === 'body') {
    panel.append(el('h3', {}, '몸을 골라'));
    const g = el('div', { class: 'mk-grid' }); panel.append(g);
    K.BASES.forEach((_, i) => { const img = el('img', { alt: '', width: 64, height: 64 }); g.append(opt(S.b === i, [img, K.BASE_LABEL[i]], () => set('b', i))); thumb(`b${i}`, { ...K.defaultChar(), b: i, pose: 0 }, { yaw: -0.3 }).then(u => { if (u) img.src = u; }); });
  } else if (tab === 'color') {
    SW ||= await K.swatchColors();
    if (myTab !== tab) return;
    const row = (label, key, list, cols) => {
      panel.append(el('h3', {}, label));
      const r = el('div', { class: 'mk-sw-row' });
      list.forEach((_, i) => r.append(el('button', { class: `mk-sw${S[key] === i ? ' on' : ''}${i === 0 ? ' orig' : ''}`, type: 'button', title: cols.label[i], 'aria-label': `${label} ${cols.label[i]}`, style: i ? `background:${cols.c[i]}` : '', onclick: () => set(key, i) })));
      panel.append(r);
    };
    row('피부', 'skin', K.SKIN, { c: SW.skin, label: K.SKIN_LABEL });
    row('머리', 'hair', K.COLORS, { c: SW.colors, label: K.COLOR_LABEL });
    row('옷 1', 'c1', K.COLORS, { c: SW.colors, label: K.COLOR_LABEL });
    row('옷 2', 'c2', K.COLORS, { c: SW.colors, label: K.COLOR_LABEL });
    panel.append(el('p', { class: 'mk-note' }, '줄무늬 동그라미 = 원래 색'));
  } else if (tab === 'hat') {
    panel.append(el('h3', {}, '모자를 골라'));
    const g = el('div', { class: 'mk-grid' }); panel.append(g);
    for (const id of K.HAT_ORDER) {
      const d = K.HAT_DEF[id], i = K.HATS.indexOf(id), open = K.hatOpen(id);
      const img = el('img', { alt: '', width: 64, height: 64 });
      g.append(opt(S.hat === i, [img, d.name, !open ? el('small', {}, lockLine(d.how)) : null, !open ? el('span', { class: 'lk' }, ic('lock')) : null],
        () => { if (!open) return lockTap(d.name, d.how); set('hat', i); }, open ? '' : ' locked'));
      thumb(`h${S.b}-${i}`, { ...K.defaultChar(), b: S.b, hat: i, pose: 0 }, { yaw: -0.3, fov: 17 }).then(u => { if (u) img.src = u; });
    }
  } else if (tab === 'pose') {
    panel.append(el('h3', {}, '카드에 찍힐 자세'));
    const g = el('div', { class: 'mk-grid' }); panel.append(g);
    K.POSES.forEach((p, i) => g.append(opt(S.pose === i, [p.name], () => { S.pose = i; K.saveChar(S); ch?.pose(i, false); DC.sfx('tap'); draw(); })));
  } else if (tab === 'planet') {
    panel.append(el('h3', {}, '어느 행성에서 왔어?'));
    const g = el('div', { class: 'mk-grid' }); panel.append(g);
    for (const p of PLANETS) g.append(el('button', { class: `mk-opt mk-planet${S.p === p.id ? ' on' : ''}`, type: 'button', style: `background-image:url(${DC.scene(p.id, 'a')})`, onclick: () => set('p', p.id, false) }, el('span', {}, p.name)));
  } else if (tab === 'name') {
    panel.append(el('h3', {}, '단어 두 개를 골라 이름을 만들어'));
    const cols = el('div', { class: 'mk-namecols' });
    const a = el('div', { class: 'mk-grid' }), b = el('div', { class: 'mk-grid' });
    K.ADJ.forEach((w, i) => a.append(opt(S.n[0] === i, [w], () => { S.n = [i, S.n[1]]; set('n', S.n, false); })));
    K.NOUN.forEach((w, i) => b.append(opt(S.n[1] === i, [w], () => { S.n = [S.n[0], i]; set('n', S.n, false); })));
    cols.append(el('div', {}, el('h4', {}, '앞 단어'), a), el('div', {}, el('h4', {}, '뒤 단어'), b)); panel.append(cols);
  } else if (tab === 'title') {
    panel.append(el('h3', {}, '칭호를 골라'));
    const g = el('div', { class: 'mk-grid' }); panel.append(g);
    K.TITLES.forEach((t, i) => { const open = K.titleOpen(i); g.append(opt(S.title === i, [t.name, open ? null : el('small', {}, ic('lock'), lockLine(t.how))], () => { if (!open) return lockTap(t.name, t.how); set('title', i, false); }, open ? '' : ' locked')); });
    panel.append(el('p', { class: 'mk-note' }, '잠긴 칭호를 누르면 여는 법이 나와. ', el('a', { href: 'arcade.html' }, ic('game'), '게임하러 가기')));
  } else if (tab === 'skill') {
    panel.append(el('h3', {}, '특기 하나'));
    const g = el('div', { class: 'mk-grid' }); panel.append(g);
    K.SKILLS.forEach((w, i) => g.append(opt(S.skill === i, [w], () => set('skill', i, false))));
  }
}

// ── 무작위 · 완성 ──
const pick = (n) => Math.floor(Math.random() * n);
$('#dice').onclick = () => {
  const hats = K.HATS.map((id, i) => i).filter(i => K.hatOpen(K.HATS[i]));
  const titles = K.TITLES.map((_, i) => i).filter(K.titleOpen);
  S = K.normalizeChar({ b: pick(K.BASES.length), skin: Math.random() < .5 ? 0 : pick(K.SKIN.length), hair: pick(K.COLORS.length), c1: pick(K.COLORS.length), c2: pick(K.COLORS.length),
    hat: hats[pick(hats.length)], pose: pick(K.POSES.length), p: PLANETS[pick(PLANETS.length)].id, n: [pick(K.ADJ.length), pick(K.NOUN.length)], title: titles[pick(titles.length)], skill: pick(K.SKILLS.length) });
  K.saveChar(S); header(); DC.sfx('swipe'); DC.buzz(15); rebuild(); draw();
};
const doneLabel = () => FLOW ? '완성! 광장으로' : '완성! 카드 만들기';
let card = null;
$('#done').onclick = async () => {
  $('#done').disabled = true; $('#done').textContent = '카드 만드는 중…';
  try {
    K.saveChar(S); card = await K.charCard(S, { badge: '내 캐릭터' });
    $('#cardImg').src = card.toDataURL('image/png'); $('#sheet').classList.remove('hidden'); DC.sfx('win'); DC.buzz([20, 40, 20]);
    DC.endings.add('maker', 'made', '캐릭터 만들기');
  } catch (e) { console.error(e); DC.toast('카드를 못 만들었어. 다시 눌러 줘'); }
  $('#done').disabled = false; $('#done').textContent = doneLabel();
};
$('#share').onclick = () => card && DC.shareCanvas(card, `dwk-캐릭터-${K.encodeChar(S)}.png`, `내 캐릭터 「${K.charName(S)}」 · @${DWK.site.handle}`);
$('#again').onclick = () => $('#sheet').classList.add('hidden');
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') $('#sheet').classList.add('hidden'); });

$('#toWorld').href = FLOW === 'world' ? 'world.html' : 'world.html?join=1';
$('#done').textContent = doneLabel();
header(); draw(); rebuild(false);
window.__maker = { get S() { return S; }, K, scene, turn, get ch() { return ch; } };
</script>
</body>
</html>
