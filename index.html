<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>행성 생존 퀴즈 · @dontwannaknow.kr</title>
<meta name="description" content="영상 본 사람만 맞히는 행성 생존 퀴즈. 점수랑 네가 살고 싶은 행성을 댓글로 남겨 줘.">
<meta property="og:title" content="행성 생존 퀴즈 — 너는 1년 버틸 수 있어?">
<meta property="og:description" content="영상 본 사람만 맞히는 10문제. @dontwannaknow.kr">
<meta property="og:image" content="img/og.jpg">
<meta name="theme-color" content="#07071a">
<style>
@font-face{font-family:Pre;src:url(fonts/Pretendard-Black.otf);font-display:swap}
@font-face{font-family:Gal;src:url(fonts/Galmuri11-Bold.woff2);font-display:swap}
:root{--y:#FFD447;--ink:#05060d;--card:rgba(20,16,48,.72);--line:rgba(255,255,255,.12);--txt:#fff;--sub:rgba(255,255,255,.78);--ok:#7CF29A;--no:#FF6B7A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--txt);min-height:100%}
body{font-family:Pre,-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--ink) url(img/bg.jpg) center top/cover fixed;line-height:1.45}
.wrap{max-width:460px;margin:0 auto;padding:22px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.px{font-family:Gal,Pre,sans-serif;-webkit-font-smoothing:none;letter-spacing:.02em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top a{color:var(--sub);text-decoration:none;font-size:14px}
.badge{font-family:Gal;font-size:14px;color:var(--y)}
h1{font-size:44px;line-height:1.05;letter-spacing:-.02em;text-shadow:0 4px 0 #000}
.lead{font-family:Gal;color:var(--y);font-size:19px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero{margin-top:22px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0 6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;clip-path:circle(43%);filter:drop-shadow(0 0 10px rgba(255,212,71,.25))}
.desc{color:var(--sub);font-size:16px;margin-top:10px;word-break:keep-all}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px 14px;font-family:Pre;font-size:20px;cursor:pointer;margin-top:14px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--y);color:#1a1300;box-shadow:0 5px 0 #b8901a}
.btn.g{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);width:0;transition:width .3s}
.qno{font-family:Gal;color:var(--y);font-size:15px;min-width:52px;text-align:right}
.qimg{display:block;width:62%;max-width:240px;aspect-ratio:1;object-fit:cover;border-radius:50%;clip-path:circle(43%);margin:4px auto 14px;filter:drop-shadow(0 0 22px rgba(130,110,255,.35))}
.ep{font-family:Gal;color:var(--y);font-size:14px;text-align:center}
.q{font-size:25px;line-height:1.25;text-align:center;margin:6px 0 16px;word-break:keep-all}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1.5px solid var(--line);color:#fff;border-radius:14px;padding:15px 16px;margin-top:10px;font-family:Pre;font-size:18px;cursor:pointer;word-break:keep-all}
.opt.ok{background:rgba(124,242,154,.18);border-color:var(--ok)}
.opt.no{background:rgba(255,107,122,.16);border-color:var(--no)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:16px;color:var(--sub);text-align:center;min-height:24px;word-break:keep-all}
.fb b{color:var(--y);font-weight:400}
.score{font-size:76px;line-height:1;text-align:center;text-shadow:0 5px 0 #000}
.score small{font-size:34px;color:var(--sub)}
.rank{font-family:Gal;color:var(--y);font-size:22px;text-align:center;margin-top:10px}
.sec{margin-top:18px}
.sec h2{font-size:26px;line-height:1.2;word-break:keep-all}
.sec p{color:var(--sub);font-size:15px;margin-top:6px;word-break:keep-all}
label{display:block;font-size:15px;color:var(--sub);margin:14px 0 6px}
input,textarea{width:100%;background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:12px;color:#fff;font-family:Pre;font-size:18px;padding:13px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--y)}
textarea{resize:none;height:84px;line-height:1.4}
.cnt{text-align:right;font-size:12px;color:var(--sub);margin-top:4px}
.preview{white-space:pre-wrap;background:rgba(0,0,0,.4);border:1px dashed rgba(255,212,71,.5);border-radius:12px;padding:14px;font-size:16px;margin-top:14px;word-break:keep-all}
.warn{font-size:13px;color:var(--sub);margin-top:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--y);color:#1a1300;font-family:Pre;padding:13px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
.foot{margin-top:auto;padding-top:26px;text-align:center;font-size:13px;color:var(--sub)}
.foot a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="badge">@dontwannaknow.kr</span><a href="https://link.inpock.co.kr/dontwannaknow.kr">← 링크 모음</a></div>

  <!-- 시작 -->
  <section id="start">
    <h1>행성 생존 퀴즈</h1>
    <p class="lead">영상 본 사람만 맞혀</p>
    <div class="card hero">
      <div class="grid" id="startGrid"></div>
      <p class="desc">행성마다 딱 하나, 절대 어기면 안 되는 규칙이 있었지.<br>10문제 다 맞히면 1년 생존 확정.</p>
      <button class="btn y" id="go">퀴즈 시작</button>
    </div>
  </section>

  <!-- 문제 -->
  <section id="quiz" class="hide">
    <div class="prog"><div class="bar"><i id="barFill"></i></div><span class="qno" id="qno">1/10</span></div>
    <div class="card">
      <p class="ep" id="ep"></p>
      <img class="qimg" id="qimg" alt="">
      <p class="q" id="qtext"></p>
      <div id="opts"></div>
      <p class="fb" id="fb"></p>
      <button class="btn y hide" id="next">다음 문제</button>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="hide">
    <div class="card">
      <p class="ep">내 생존 점수</p>
      <p class="score" id="score">0<small>/10</small></p>
      <p class="rank" id="rank"></p>
    </div>
    <div class="card sec">
      <h2>이제 네 차례.<br>살고 싶은 행성을 제안해 줘</h2>
      <p>행성 이름이랑 어떤 곳인지 한 줄이면 돼. 아래에 댓글이 만들어져.</p>
      <label for="pname">행성 이름</label>
      <input id="pname" maxlength="20" placeholder="예) 고양이 털 행성" autocomplete="off">
      <p class="cnt"><span id="c1">0</span>/20</p>
      <label for="pdesc">어떤 행성이야?</label>
      <textarea id="pdesc" maxlength="60" placeholder="예) 땅이 전부 말랑한 고양이 배야"></textarea>
      <p class="cnt"><span id="c2">0</span>/60</p>
      <div class="preview" id="preview"></div>
      <button class="btn y" id="copyGo">댓글 복사하고 인스타로 가기</button>
      <button class="btn g" id="copyOnly">복사만 하기</button>
      <p class="warn">이름·학교·전화번호 같은 개인정보는 쓰지 마. 여기 쓴 글은 어디에도 저장되지 않아 — 복사해서 네가 직접 댓글로 남기는 방식이야.</p>
    </div>
    <button class="btn g" id="again">다시 풀기</button>
  </section>

  <p class="foot">돈워너노우 · <a href="https://www.instagram.com/dontwannaknow.kr/">인스타그램</a></p>
</div>
<div class="toast" id="toast"></div>

<script>
// 댓글을 달 게시물 — 새 편이 올라오면 이 주소만 바꾼다
const COMMENT_URL = 'https://www.instagram.com/reel/Df8jHbHlaqL/'; // 행성 #5
const TOTAL = 10;
// 정답 = 실제 게시 영상 자막의 생존 규칙(원문: reports/급성장카피_20261117/제작 · 사이트 data.js · src_sn/timeline_sn.js · src11p/timeline11_v6.js)
const BANK = [
  { ep:'1편', img:'p01_1', q:'해바라기 행성에서 절대 하면 안 되는 건?', a:'불 켜 두기', w:['코 골기','단 거 먹기'] },
  { ep:'1편', img:'p01_2', q:'온천 행성. 당장 나와야 하는 순간은?', a:'물이 빠지면', w:['물이 뜨거워지면','눈이 그치면'] },
  { ep:'1편', img:'p01_3', q:'쇼핑몰 행성 생존 규칙은?', a:'9시 전에 가게 안으로 들어가', w:['밤엔 침대에서 나오지 마','계산대엔 절대 가지 마'] },
  { ep:'1편', img:'p01_4', q:'반딧불 호수 행성의 함정은?', a:'함정이 없어. 진짜로.', w:['반딧불을 세면 안 돼','밤에 물에 들어가면 안 돼'] },
  { ep:'2편', img:'p02_1', q:'호수 행성에서 절대 하면 안 되는 건?', a:'호수랑 눈 마주치기', w:['호수에서 수영하기','호수 물 마시기'] },
  { ep:'2편', img:'p02_3', q:'하얀 숲이 손을 흔들면?', a:'절대 흔들어 주지 마', w:['같이 흔들어 줘','박수 쳐 줘'] },
  { ep:'3편', img:'p03_1', q:'디저트 행성 생존 규칙은?', a:'단 건 한 입도 먹지 마', w:['해가 지면 집에 들어가','물은 마시지 마'] },
  { ep:'3편', img:'p03_2', q:'물방울 행성. 보름달이 뜨면?', a:'숨을 크게 들이마셔', w:['눈을 꼭 감아','물 밖으로 나와'] },
  { ep:'3편', img:'p03_3', q:'잠든 양 위 구름 행성에서 절대 하면 안 되는 건?', a:'코 골기', w:['큰 소리로 노래하기','뛰어다니기'] },
  { ep:'수능 특별편', img:'sn_1', q:'수능 없는 행성. 여기선 절대…', a:'아프지 마', w:['공부하지 마','바다에 들어가지 마'] },
  { ep:'수능 특별편', img:'sn_2', q:'매일 수능 행성. 듣기 시간엔?', a:'재채기도 참아', w:['귀를 막아','창문을 닫아'] },
  { ep:'수능 특별편', img:'sn_3', q:'수능 한 번 행성의 정체는?', a:'지구', w:['달','화성'] },
  { ep:'5편', img:'p05_1', q:'카피바라 행성 생존 규칙은?', a:'유자는 절대 다 먹지 마', w:['온천에 들어가지 마','다른 동물을 태우지 마'] },
  { ep:'5편', img:'p05_2', q:'뚱냥이 행성. 고양이가 깨어 있으면?', a:'절대 움직이지 마', w:['바로 엎드려','이름을 불러 줘'] },
  { ep:'5편', img:'p05_3', q:'푸바오가 대나무를 먹다가도 고개를 드는 건?', a:'자기를 불러 주던 목소리', w:['대나무 쪼개지는 소리','천둥소리'] },
  { ep:'5편', img:'p05_4', q:'부캉이는 네가 어디 있는지 어떻게 알아?', a:'심장이 뛸 때 나는 작은 전기', w:['냄새','발소리'] },
];
const RANKS = [[10,'1년 생존 확정 · 행성 마스터'],[8,'생존 고수 · 거의 다 봤네'],[5,'반쯤 살아남음'],[0,'첫날 탈락… 영상 다시 보고 와']];
const $ = s => document.querySelector(s);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let qs = [], i = 0, score = 0;

// 시작 화면 행성 10개(편마다 고르게)
['p01_1','p01_3','p02_1','p02_3','p03_2','p03_3','sn_1','sn_3','p05_1','p05_4'].forEach(k => { const im = new Image(); im.src = `img/${k}.jpg`; im.alt = ''; $('#startGrid').append(im); });
BANK.forEach(b => { const im = new Image(); im.src = `img/${b.img}.jpg`; }); // 미리 받아 두기

function start() {
  // 편마다 최소 1문제가 들어가게 고른 뒤 나머지는 무작위
  const byEp = {}; BANK.forEach(b => (byEp[b.ep] ||= []).push(b));
  const pick = Object.values(byEp).map(list => shuffle([...list])[0]);
  const rest = shuffle(BANK.filter(b => !pick.includes(b))).slice(0, TOTAL - pick.length);
  const order = ['1편','2편','3편','수능 특별편','5편'];
  qs = [...pick, ...rest].sort((a, b) => order.indexOf(a.ep) - order.indexOf(b.ep));
  i = 0; score = 0;
  $('#start').classList.add('hide'); $('#result').classList.add('hide'); $('#quiz').classList.remove('hide');
  show();
}
function show() {
  const b = qs[i];
  $('#qno').textContent = `${i + 1}/${TOTAL}`; $('#barFill').style.width = `${i / TOTAL * 100}%`;
  $('#ep').textContent = b.ep; $('#qimg').src = `img/${b.img}.jpg`; $('#qtext').textContent = b.q;
  $('#fb').innerHTML = ''; $('#next').classList.add('hide');
  const box = $('#opts'); box.replaceChildren();
  shuffle([b.a, ...b.w]).forEach(t => {
    const o = document.createElement('button'); o.className = 'opt'; o.textContent = t;
    o.onclick = () => pick(o, t === b.a); box.append(o);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function pick(el, ok) {
  const b = qs[i];
  document.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (o.textContent === b.a) o.classList.add('ok'); });
  if (ok) { score++; $('#fb').innerHTML = '<b>정답!</b> 살아남았어.'; if (navigator.vibrate) navigator.vibrate(18); }
  else { el.classList.add('no'); $('#fb').innerHTML = `땡. 정답은 <b>${b.a}</b>`; if (navigator.vibrate) navigator.vibrate([30, 40, 30]); }
  $('#barFill').style.width = `${(i + 1) / TOTAL * 100}%`;
  $('#next').textContent = i + 1 < TOTAL ? '다음 문제' : '결과 보기';
  $('#next').classList.remove('hide');
}
function next() { i++; if (i < TOTAL) show(); else result(); }
function result() {
  $('#quiz').classList.add('hide'); $('#result').classList.remove('hide');
  $('#score').innerHTML = `${score}<small>/${TOTAL}</small>`;
  $('#rank').textContent = RANKS.find(([n]) => score >= n)[1];
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function comment() {
  const n = $('#pname').value.trim(), d = $('#pdesc').value.trim().replace(/\s+/g, ' ');
  let t = `🪐 행성 생존 퀴즈 ${score}/${TOTAL}점`;
  t += `\n내가 살고 싶은 행성: ${n || '(행성 이름)'}`;
  if (d) t += `\n${d}`;
  return t;
}
function render() { $('#c1').textContent = $('#pname').value.length; $('#c2').textContent = $('#pdesc').value.length; $('#preview').textContent = comment(); }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }
async function copy() {
  if (!$('#pname').value.trim()) { toast('행성 이름부터 써 줘'); $('#pname').focus(); return false; }
  const text = comment();
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove(); }
  return true;
}
$('#go').onclick = start; $('#next').onclick = next; $('#again').onclick = start;
$('#pname').oninput = render; $('#pdesc').oninput = render;
$('#copyOnly').onclick = async () => { if (await copy()) toast('복사했어! 인스타 댓글창에 붙여 넣어 줘'); };
$('#copyGo').onclick = async () => { if (await copy()) { toast('복사했어! 댓글창에 붙여 넣어 줘'); setTimeout(() => { location.href = COMMENT_URL; }, 900); } };
</script>
</body>
</html>
