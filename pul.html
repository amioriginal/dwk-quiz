<style>
@font-face{font-family:Pre;src:url(fonts/Pretendard-Black.otf);font-display:swap}
@font-face{font-family:Gal;src:url(fonts/Galmuri11-Bold.woff2);font-display:swap}
:root{--y:#FFD447;--ink:#05060d;--card:rgba(20,16,48,.72);--line:rgba(255,255,255,.12);--txt:#fff;--sub:rgba(255,255,255,.78);--ok:#7CF29A;--no:#FF6B7A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--txt);min-height:100%}
body{font-family:Pre,-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--ink) url(img/bg.jpg) center top/cover fixed;line-height:1.45}
.wrap{max-width:460px;margin:0 auto;padding:22px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.px{font-family:Gal,Pre,sans-serif;-webkit-font-smoothing:none;letter-spacing:.02em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top a{color:var(--sub);text-decoration:none;font-size:14px}
.badge{font-family:Gal;font-size:14px;color:var(--y)}
h1{font-size:44px;line-height:1.05;letter-spacing:-.02em;text-shadow:0 4px 0 #000}
.lead{font-family:Gal;color:var(--y);font-size:19px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero{margin-top:22px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0 6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;clip-path:circle(43%);filter:drop-shadow(0 0 10px rgba(255,212,71,.25))}
.desc{color:var(--sub);font-size:16px;margin-top:10px;word-break:keep-all}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px 14px;font-family:Pre;font-size:20px;cursor:pointer;margin-top:14px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--y);color:#1a1300;box-shadow:0 5px 0 #b8901a}
.btn.g{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line)}
.btn.o{background:transparent;color:var(--y);border:2px solid var(--y)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);width:0;transition:width .3s}
.qno{font-family:Gal;color:var(--y);font-size:15px;min-width:52px;text-align:right}
.qimg{display:block;width:62%;max-width:240px;aspect-ratio:1;object-fit:cover;border-radius:50%;clip-path:circle(43%);margin:4px auto 14px;filter:drop-shadow(0 0 22px rgba(130,110,255,.35))}
.ep{font-family:Gal;color:var(--y);font-size:14px;text-align:center}
.q{font-size:25px;line-height:1.25;text-align:center;margin:6px 0 16px;word-break:keep-all}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1.5px solid var(--line);color:#fff;border-radius:14px;padding:15px 16px;margin-top:10px;font-family:Pre;font-size:18px;cursor:pointer;word-break:keep-all}
.opt.ok{background:rgba(124,242,154,.18);border-color:var(--ok)}
.opt.no{background:rgba(255,107,122,.16);border-color:var(--no)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:16px;color:var(--sub);text-align:center;min-height:24px;word-break:keep-all}
.fb b{color:var(--y);font-weight:400}
.score{font-size:76px;line-height:1;text-align:center;text-shadow:0 5px 0 #000}
.score small{font-size:34px;color:var(--sub)}
.rank{font-family:Gal;color:var(--y);font-size:22px;text-align:center;margin-top:10px}
.sec{margin-top:18px}
.sec h2{font-size:26px;line-height:1.2;word-break:keep-all}
.sec p{color:var(--sub);font-size:15px;margin-top:6px;word-break:keep-all}
label{display:block;font-size:15px;color:var(--sub);margin:14px 0 6px}
input,textarea{width:100%;background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:12px;color:#fff;font-family:Pre;font-size:18px;padding:13px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--y)}
textarea{resize:none;height:84px;line-height:1.4}
.cnt{text-align:right;font-size:12px;color:var(--sub);margin-top:4px}
.preview{white-space:pre-wrap;background:rgba(0,0,0,.4);border:1px dashed rgba(255,212,71,.5);border-radius:12px;padding:14px;font-size:16px;margin-top:14px;word-break:keep-all}
.warn{font-size:13px;color:var(--sub);margin-top:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--y);color:#1a1300;font-family:Pre;padding:13px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pick{text-align:left;margin:14px 0 4px}
.eps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.epc{position:relative;display:block;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:#000;cursor:pointer;padding:0;color:#fff;text-align:left;font-family:Pre}
.epc img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 40%;opacity:.88}
.epc span{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 11px;background:linear-gradient(transparent,rgba(5,6,13,.92))}
.epc b{display:block;font-family:Gal;color:var(--y);font-weight:400;font-size:15px}
.epc i{display:block;font-style:normal;font-size:15px;margin-top:2px;word-break:keep-all}
.epc em{position:absolute;top:9px;right:9px;font-style:normal;font-family:Gal;font-size:12px;background:var(--y);color:#1a1300;padding:3px 7px;border-radius:8px}
.epc:active{transform:scale(.98)}
.fan{margin-top:16px;text-align:center;font-size:27px;line-height:1.2;color:var(--y);text-shadow:0 0 18px rgba(255,212,71,.55),0 3px 0 #000;word-break:keep-all;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.hide{display:none!important}
.foot{margin-top:auto;padding-top:26px;text-align:center;font-size:13px;color:var(--sub)}
.foot a{color:var(--sub)}
.fg{position:fixed;inset:0;z-index:20;background:rgba(5,6,13,.8);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fgin .25s ease-out}
.fg .card{width:100%;max-width:400px;text-align:center;background:rgba(24,18,58,.96);border-color:rgba(255,212,71,.35);padding:26px 20px 20px}
.fg .hi{font-family:Gal;color:var(--y);font-size:34px;line-height:1}
.fg h3{font-size:27px;line-height:1.25;margin-top:10px;white-space:pre-line;word-break:keep-all;text-shadow:0 3px 0 #000}
.fg .sub{font-family:Gal;color:var(--sub);font-size:15px;margin-top:8px}
.fg a.btn{text-decoration:none;text-align:center;margin-top:18px}
.fg small{display:block;color:var(--sub);font-size:13px;margin-top:12px;word-break:keep-all}
.fg .perk{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(255,212,71,.12);color:#fff;font-size:15px;line-height:1.4;white-space:pre-line;word-break:keep-all}
@keyframes fgin{from{opacity:0}to{opacity:1}}
.foot .note{display:block;margin-top:8px;font-size:11px;opacity:.6;word-break:keep-all}

.h{font-size:28px;line-height:1.2;margin:6px 0 4px;word-break:keep-all}
.four{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pl{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:18px;padding:10px;color:#fff;font-family:Gal;font-size:18px;cursor:pointer}
.pl img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;clip-path:circle(43%)}
.res{text-align:left}.res .ep{text-align:center}.res .qimg{width:48%}
.you{text-align:center;color:var(--sub);font-size:16px}
.t{font-size:32px;line-height:1.2;text-align:center;margin:4px 0 6px;word-break:keep-all;text-shadow:0 3px 0 #000}
.sec h3{font-family:Gal;color:var(--y);font-size:16px;font-weight:400}
.sec p{color:#fff;font-size:16px;margin-top:4px}
.rk{margin-top:18px;background:rgba(255,212,71,.14);border:1px solid rgba(255,212,71,.4);border-radius:14px;padding:12px;text-align:center;font-size:16px;word-break:keep-all}
a.btn{text-align:center;text-decoration:none}
.steps{margin:14px 0 4px;text-align:left}.steps p{font-size:17px;margin-top:8px;color:#fff}.steps b{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--y);color:#1a1300;text-align:center;line-height:26px;font-family:Gal;font-weight:400;margin-right:8px}
button.pl{font:inherit}
/* 줄바꿈 — 휴대폰 폭에서 마지막 낱말 하나만 다음 줄로 떨어지지 않게(대표 11-23 「조용히 오래 빛나는 / 사람」 지적) */
.h,.t,.q,.you,.mine,.ep,.sec h3,.h3,.rk,.desc,.steps p{text-wrap:balance}
.sec p,.a p{text-wrap:pretty}
.fit{white-space:nowrap;display:block;overflow:hidden}
.mine{text-align:center;color:var(--y);font-size:16px;margin:4px 0 2px;word-break:keep-all}
.hd{text-align:center;font-family:Gal;color:var(--sub);font-size:13px;margin-top:12px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.dgc{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:10px;color:var(--sub);text-decoration:none;font-size:13px;word-break:keep-all}
.dgc b{display:block;font-family:Gal;font-weight:400;color:var(--sub);font-size:13px}
.dgc.on{border-style:solid;border-color:rgba(255,212,71,.55);color:#fff;background:rgba(255,212,71,.08)}.dgc.on b{color:var(--y)}
.dgc.me{box-shadow:0 0 0 2px var(--y) inset}
a.pl{text-decoration:none;display:block;text-align:center}
.pl span{display:block;margin-top:4px}.pl small{display:block;font-family:Pre;font-size:13px;color:var(--y);margin-top:2px;word-break:keep-all}
.more{margin-top:14px}.h3{font-size:20px}
</style>
